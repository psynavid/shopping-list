<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لیست خرید</title>

<meta name="theme-color" content="#f5e6d2">
<link rel="apple-touch-icon" href="icon-green-fancy.png">
<link rel="icon" sizes="192x192" href="icon-green-fancy.png">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5e6d2;
  margin: 0;
  padding: 10px;
  color: #4b3f2f;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

h2 {
  text-align: center;
  margin: 18px 0 8px;
}

.item-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #fff3e0;
  padding: 6px 10px;
  margin-bottom: 6px;
  border-radius: 8px;
}

.item-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.qty-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.qty-group button {
  background: #d2b48c;
  border: none;
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 16px;
}

.qty {
  min-width: 24px;
  text-align: center;
  font-weight: bold;
}

button {
  cursor: pointer;
}

#reset-btn, #share-btn, #share-text-btn, #pdf-btn {
  background: #cfa77f;
  border: none;
  border-radius: 8px;
  padding: 6px 12px;
  margin: 4px;
}

#action-bar {
  text-align: center;
  margin-top: 14px;
}

#special-orders {
  text-align: center;
  margin-top: 16px;
}

#special-orders textarea {
  width: 90%;
  max-width: 420px;
  min-height: 40px;
  border-radius: 8px;
  padding: 6px;
  border: 1px solid #cfa77f;
  resize: vertical;
  direction: rtl;
}
</style>
</head>

<body>

<h1>🛒 لیست خرید هفتگی</h1>

<div style="text-align:center;">
  <button id="reset-btn">🔄 Reset All</button>
</div>

<div id="shopping-list"></div>

<div id="special-orders">
  <strong>سفارشات ویژه</strong><br>
  <textarea id="special-text" placeholder="هر چیزی که لازم دارید..."></textarea>
</div>

<div id="action-bar">
  <button id="share-btn">📤 Share App</button>
  <button id="share-text-btn">📋 Share Checked Items</button>
  <button id="pdf-btn">📄 Export PDF</button>
</div>

<script>
const shoppingData = {
  "سبزیجات 🥦": ["بادمجان","برکلی","پیاز","سیب زمینی","سیب زمینی کوچک","شلغم","اسفناج","کاهو","کدو","گل کلم","گوجه فرنگی","گوجه گیلاسی","خیار","خیار شور","فلفل دلمه","فلفل سبز","هویج","هویج کوچک","لوبیا","لوبیا سبز فریز شده","عدس","قارچ","ذرت فریز شده"],
  "میوه جات 🍎": ["انگور","بلوبری","پرتقال","توت فرنگی","سیب","موز","نارنگی","هندوانه","لبو"],
  "لبنیات 🥛": ["بستنی","پنیر","پنیر پیتزا","خامه","خامه صبحانه","دوغ","شیر","ماست","کره"],
  "گوشت و ماهی 🍗": ["گوشت چرخ کرده","گوشت تیکه شده","گوشت مرغ","شینسل","ناگت","ماهی سالمون"],
  "نان و غلات 🍞": ["آرد","برنج","نان","نان تست","نان پیتزا","نان همبر"],
  "خشکبار و مغزها 🌰": ["خرما","مغز بادام","مغز گردو"],
  "بهداشت و شوینده 🧴": ["دستمال توالت","دستمال کاغذی","صابون","شامپو","مایع ظرف شویی","تاید ماشین لباس شویی","تاید ماشین ظرف شویی"],
  "متفرقه": ["ادویه","اسنک برای مدرسه","چیپس","سس کچاپ","شکلات صبحانه","کره بادام زمینی","قهوه","کیک و شیرینی عصرانه","نودل","پاپ کرن","روغن زیتون","روغن مایع","سرکه","نمک","سوشی","مربا","دارو"]
};

for (let cat in shoppingData) shoppingData[cat].sort();

const listDiv = document.getElementById("shopping-list");

for (let cat in shoppingData) {
  const h2 = document.createElement("h2");
  h2.textContent = cat;
  listDiv.appendChild(h2);

  shoppingData[cat].forEach(item => {
    const row = document.createElement("div");
    row.className = "item-row";

    const left = document.createElement("div");
    left.className = "item-left";

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = localStorage.getItem(item+"_checked")==="true";

    const name = document.createElement("span");
    name.textContent = item;

    left.append(cb,name);

    const qtyGroup = document.createElement("div");
    qtyGroup.className = "qty-group";

    const minus = document.createElement("button");
    minus.textContent = "−";

    const qty = document.createElement("span");
    qty.className = "qty";
    qty.textContent = cb.checked ? (localStorage.getItem(item+"_qty")||1) : 1;

    const plus = document.createElement("button");
    plus.textContent = "+";

    minus.onclick = () => {
      if (!cb.checked) return;
      let v = parseInt(qty.textContent);
      if (v>1){ qty.textContent=--v; localStorage.setItem(item+"_qty",v); }
    };

    plus.onclick = () => {
      if (!cb.checked) return;
      let v = parseInt(qty.textContent)+1;
      qty.textContent=v;
      localStorage.setItem(item+"_qty",v);
    };

    cb.onchange = () => {
      if (cb.checked){
        localStorage.setItem(item+"_checked",true);
        localStorage.setItem(item+"_qty",qty.textContent);
      } else {
        localStorage.removeItem(item+"_checked");
        localStorage.removeItem(item+"_qty");
        qty.textContent=1;
      }
    };

    qtyGroup.append(minus,qty,plus);
    row.append(left,qtyGroup);
    listDiv.appendChild(row);
  });
}

// Reset
document.getElementById("reset-btn").onclick = () => {
  if(!confirm("Reset everything?")) return;
  localStorage.clear();
  document.getElementById("special-text").value="";
  location.reload();
};

// Share app
document.getElementById("share-btn").onclick = () => {
  navigator.share?.({ title:"Shopping List", url:location.href });
};

// Share checked items as text
document.getElementById("share-text-btn").onclick = () => {
  let text="🛒 Shopping List\n\n", has=false;
  for(let c in shoppingData){
    shoppingData[c].forEach(i=>{
      if(localStorage.getItem(i+"_checked")==="true"){
        has=true;
        text+=`✓ ${i} × ${localStorage.getItem(i+"_qty")||1}\n`;
      }
    });
  }
  const s=localStorage.getItem("special_orders");
  if(s) text+=`\nسفارشات ویژه:\n${s}`;
  if(!has && !s){ alert("Nothing to share"); return; }
  navigator.share? navigator.share({text}) : alert(text);
};

// PDF
document.getElementById("pdf-btn").onclick = () => {
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([document.body.innerHTML],{type:"text/html"}));
  a.download="shopping_list.html";
  a.click();
};

// Special orders persistence
const sp=document.getElementById("special-text");
sp.value=localStorage.getItem("special_orders")||"";
sp.oninput=()=>localStorage.setItem("special_orders",sp.value);
</script>

</body>
</html>
