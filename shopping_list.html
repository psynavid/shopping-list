<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping List</title>

<link rel="apple-touch-icon" href="icon-green-fancy.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-green-fancy.png">
<meta name="theme-color" content="#f5e6d2">

<style>
body {
  font-family: Arial, sans-serif;
  padding: 10px;
  background: #f5e6d2;
  color: #4b3f2f;
}
h1 { text-align: center; color: #4b3f2f; }
h2 { text-align: center; margin: 20px 0 10px 0; color: #4b3f2f; }
.item-row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; padding: 6px 10px; border-radius: 6px; background: #fff5e6; }
.item-left { display: flex; align-items: center; gap: 8px; }
.qty-group { display: flex; align-items: center; gap: 4px; }
.item-row button { padding: 2px 8px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; background: #cfa77f; color: #4b3f2f; }
.item-row button:hover { background: #b98b61; }
.item-row span.qty { min-width: 24px; text-align: center; font-weight: bold; }
#reset-btn, #share-btn, #pdf-btn { display: inline-block; margin: 5px; padding: 6px 12px; font-size: 16px; background: #cfa77f; color: #4b3f2f; border: none; border-radius: 6px; cursor: pointer; }
#reset-btn:hover, #share-btn:hover, #pdf-btn:hover { background: #b98b61; }
#action-bar { margin-top: 20px; text-align: center; }
#special-orders textarea { width: 90%; max-width: 400px; min-height: 40px; padding:6px; border-radius:6px; border:1px solid #cfa77f; resize: vertical; text-align: right; }
#special-orders label { font-weight: bold; display: block; margin-bottom: 6px; }
</style>
</head>
<body>
<h1>لیست خرید هفتگی 🛒</h1>
<button id="reset-btn">🔄 Reset All</button>
<div id="shopping-list"></div>

<!-- Special Orders Box -->
<div id="special-orders" style="margin-top: 20px; text-align: center;">
  <label for="special-text">سفارشات ویژه</label>
  <textarea id="special-text" placeholder="هر چیزی که لازم دارید..."></textarea>
</div>

<div id="action-bar">
  <button id="share-btn">📤 Share List</button>
  <button id="pdf-btn">📄 Export PDF</button>
</div>

<script>
// Updated structured shopping data with sorting
const shoppingData = {
  "سبزیجات 🥦": ["کاهو","برکلی","گل کلم","اسفناج","پیاز","سیب زمینی","سیب زمینی کوچک","هویج","هویج کوچک","گوجه فرنگی","گوجه گیلاسی","شلغم","کدو","بادمجان","فلفل دلمه","فلفل سبز","خیار","خیار شور","لوبیا","لوبیا سبز فریز شده","عدس","قارچ","ذرت فریز شده"],
  "میوه جات 🍎": ["سیب","موز","توت فرنگی","انگور","هندوانه","بلوبری","نارنگی","پرتقال","لبو"],
  "لبنیات 🥛": ["شیر","ماست","پنیر","پنیر پیتزا","خامه","دوغ","کره","خامه صبحانه","بستنی"],
  "گوشت و ماهی 🍗": ["گوشت مرغ","گوشت چرخ کرده","گوشت تیکه شده","شینسل","ناگت","ماهی سالمون"],
  "نان و غلات 🍞": ["نان","نان تست","نان پیتزا","نان همبر","آرد","برنج"],
  "دیگر 🥫": ["مربا","روغن مایع","روغن زیتون","سرکه","نمک","ادویه","سس کچاپ","شکلات صبحانه","چیپس","پاپ کرن","اسنک برای مدرسه","کیک و شیرینی عصرانه","نودل","سوشی"],
  "بهداشت و شوینده 🧴": ["صابون","شامپو","مایع ظرف شویی","تاید ماشین لباس شویی","تاید ماشین ظرف شویی","دستمال کاغذی","دستمال توالت"],
  "پوشاک 👕": ["لباس و پوشاک"],
  "خشکبار و مغزها 🌰": ["مغز گردو","مغز بادام","خرما"],
  "متفرقه": ["دارو","قهوه","پینات"]
};

// Helper function to sort items logically
for(let category in shoppingData){
  shoppingData[category].sort();
}

const listDiv = document.getElementById("shopping-list");

for (let category in shoppingData) {
  const h2 = document.createElement("h2");
  h2.textContent = category;
  listDiv.appendChild(h2);

  shoppingData[category].forEach(item => {
    const itemRow = document.createElement("div");
    itemRow.className = "item-row";

    // LEFT: checkbox + name
    const itemLeft = document.createElement("div");
    itemLeft.className = "item-left";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = localStorage.getItem(item + "_checked") === "true";

    const nameSpan = document.createElement("span");
    nameSpan.textContent = item;

    itemLeft.appendChild(checkbox);
    itemLeft.appendChild(nameSpan);

    // RIGHT: quantity
    const qtyGroup = document.createElement("div");
    qtyGroup.className = "qty-group";

    const minus = document.createElement("button");
    minus.textContent = "−";

    const qty = document.createElement("span");
    qty.className = "qty";

    // Only persist number if checked
    qty.textContent = checkbox.checked ? (localStorage.getItem(item + "_qty") || 1) : 1;

    const plus = document.createElement("button");
    plus.textContent = "+";

    minus.onclick = () => {
      let val = parseInt(qty.textContent);
      if(val > 1){
        val--;
        qty.textContent = val;
        if(checkbox.checked) localStorage.setItem(item + "_qty", val);
      }
    };
    plus.onclick = () => {
      let val = parseInt(qty.textContent);
      val++;
      qty.textContent = val;
      if(checkbox.checked) localStorage.setItem(item + "_qty", val);
    };

    checkbox.addEventListener("change", () => {
      if(checkbox.checked){
        localStorage.setItem(item + "_checked", true);
        localStorage.setItem(item + "_qty", qty.textContent);
      } else {
        localStorage.removeItem(item + "_checked");
        localStorage.removeItem(item + "_qty");
        qty.textContent = 1;
      }
    });

    qtyGroup.appendChild(minus);
    qtyGroup.appendChild(qty);
    qtyGroup.appendChild(plus);

    itemRow.appendChild(itemLeft);
    itemRow.appendChild(qtyGroup);

    listDiv.appendChild(itemRow);
  });
}

// Reset All button
document.getElementById("reset-btn").onclick = () => {
  if(confirm("Are you sure you want to reset all checkboxes and quantities?")) {
    for(let category in shoppingData){
      shoppingData[category].forEach(item => {
        localStorage.removeItem(item + "_checked");
        localStorage.removeItem(item + "_qty");
      });
    }
    location.reload();
  }
};

// Share button
document.getElementById("share-btn").onclick = () => {
  if(navigator.share){
    navigator.share({
      title: "لیست خرید من 🛒",
      text: "لیست خرید هفتگی من:\n" + document.getElementById("special-text").value,
      url: window.location.href
    }).catch(console.error);
  } else { alert("Sharing not supported on this browser."); }
};

// PDF button
document.getElementById("pdf-btn").onclick = () => {
  const blob = new Blob([document.getElementById("shopping-list").outerHTML + "<br>سفارشات ویژه:<br>" + document.getElementById("special-text").value], {type: "text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "shopping_list.html";
  a.click();
};

// Special Orders persistence
const specialText = document.getElementById("special-text");
specialText.value = localStorage.getItem("special_orders") || "";
specialText.addEventListener("input", () => {
  localStorage.setItem("special_orders", specialText.value);
});
</script>
</body>
</html>
