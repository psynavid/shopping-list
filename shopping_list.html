<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping List</title>

<!-- Home Screen icons -->
<link rel="apple-touch-icon" href="icon-green.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-green.png">
<meta name="theme-color" content="#d2b48c"> <!-- very light chocolate -->

<style>
body {
  font-family: Arial, sans-serif;
  padding: 10px;
  background: #f5e6d2; /* very light chocolate */
  color: #4b3f2f; /* dark chocolate text */
}
h1 {
  text-align: center;
  color: #4b3f2f;
}
h2 {
  text-align: center;
  margin: 20px 0 10px 0;
  color: #4b3f2f;
}
.item-row {
  display: flex;
  justify-content: space-between; /* qty to right */
  align-items: center;
  margin: 6px 0;
  padding: 6px 10px;
  border-radius: 6px;
  background: #fff5e6; /* creamy background for items */
}
.item-left {
  display: flex;
  gap: 8px;
  align-items: center;
}
.item-row button {
  padding: 2px 8px;
  font-size: 16px;
  cursor: pointer;
  border: none;
  border-radius: 4px;
  background: #cfa77f; /* light coffee color */
  color: #4b3f2f;
}
.item-row button:hover {
  background: #b98b61;
}
.item-row span.qty {
  min-width: 24px;
  text-align: right;
  font-weight: bold;
}
#reset-btn, #share-btn, #pdf-btn {
  display: inline-block;
  margin: 5px;
  padding: 6px 12px;
  font-size: 16px;
  background: #cfa77f; /* light coffee button */
  color: #4b3f2f;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
#reset-btn:hover, #share-btn:hover, #pdf-btn:hover {
  background: #b98b61;
}
#action-bar {
  margin-top: 20px;
  text-align: center;
}
</style>
</head>
<body>
<h1>لیست خرید هفتگی 🛒</h1>
<button id="reset-btn">🔄 Reset All</button>

<div id="shopping-list"></div>

<div id="action-bar">
  <button id="share-btn">📤 Share List</button>
  <button id="pdf-btn">📄 Export PDF</button>
</div>

<script>
const shoppingData = {
  "سبزیجات 🥦": ["پیاز","سیب زمینی","سیب زمینی کوچک","هویج","هویج کوچک","گوجه فرنگی","گوجه گیلاسی","شلغم","کدو","بادمجان","لوبیا سبز فریز شده","فلفل دلمه","فلفل سبز","کاهو","گل کلم","اسفناج","خیار","خیار شور","برکلی","لوبیا","عدس","قارچ","ذرت فریز شده"],
  "میوه جات 🍎": ["سیب","موز","توت فرنگی","انگور","هندوانه","بلوبری","نارنگی","پرتقال","لبو"],
  "لبنیات 🥛": ["شیر","ماست","پنیر","پنیر پیتزا","خامه","دوغ","کره","خامه صبحانه"],
  "گوشت و ماهی 🍗": ["گوشت مرغ","گوشت چرخ کرده","گوشت تیکه شده","شینسل","ناگت","ماهی سالمون"],
  "نان و غلات 🍞": ["نان تست","نان پیتزا","نان همبر"],
  "دیگر 🥫": ["برنج","مربا","روغن مایع","روغن زیتون","سرکه","آرد","نمک","ادویه","سس کچاپ","شکلات صبحانه","چیپس","پاپ کرن","اسنک برای مدرسه","کیک و شیرینی عصرانه","نودل","سوشی"],
  "بهداشت و شوینده 🧴": ["صابون","شامپو","مایع ظرف شویی","تاید ماشین لباس شویی","تاید ماشین ظرف شویی","دستمال کاغذی","دستمال توالت"],
  "پوشاک 👕": ["لباس و پوشاک"],
  "خشکبار و مغزها 🌰": ["مغز گردو","مغز بادام"],
  "دیگر": ["دارو","قهوه","بستنی","پینات"]
};

const listDiv = document.getElementById("shopping-list");

for (let category in shoppingData) {
  const h2 = document.createElement("h2");
  h2.textContent = category;
  listDiv.appendChild(h2);

  shoppingData[category].forEach(item => {
    const itemRow = document.createElement("div");
    itemRow.className = "item-row";

    const itemLeft = document.createElement("div");
    itemLeft.className = "item-left";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = localStorage.getItem(item + "_checked") === "true";
    checkbox.addEventListener("change", () => {
      localStorage.setItem(item + "_checked", checkbox.checked);
    });

    const nameSpan = document.createElement("span");
    nameSpan.textContent = item;

    const minus = document.createElement("button");
    minus.textContent = "−";

    const plus = document.createElement("button");
    plus.textContent = "+";

    minus.onclick = () => {
      let val = parseInt(qty.textContent);
      if (val > 1) {
        val--;
        qty.textContent = val;
        localStorage.setItem(item + "_qty", val);
      }
    };

    plus.onclick = () => {
      let val = parseInt(qty.textContent);
      val++;
      qty.textContent = val;
      localStorage.setItem(item + "_qty", val);
    };

    const qty = document.createElement("span");
    qty.className = "qty";
    qty.textContent = localStorage.getItem(item + "_qty") || 1;

    // build row
    itemLeft.appendChild(checkbox);
    itemLeft.appendChild(nameSpan);
    itemLeft.appendChild(minus);
    itemLeft.appendChild(plus);

    itemRow.appendChild(itemLeft);
    itemRow.appendChild(qty);

    listDiv.appendChild(itemRow);
  });
}

// Reset All button
document.getElementById("reset-btn").onclick = () => {
  if(confirm("Are you sure you want to reset all checkboxes and quantities?")) {
    for (let category in shoppingData) {
      shoppingData[category].forEach(item => {
        localStorage.removeItem(item + "_checked");
        localStorage.removeItem(item + "_qty");
      });
    }
    location.reload();
  }
};

// Share button
document.getElementById("share-btn").onclick = () => {
  if(navigator.share){
    navigator.share({
      title: "لیست خرید من 🛒",
      text: "لیست خرید هفتگی من:",
      url: window.location.href
    }).catch(console.error);
  } else {
    alert("Sharing not supported on this browser.");
  }
};

// PDF button (simple HTML export)
document.getElementById("pdf-btn").onclick = () => {
  const blob = new Blob([document.getElementById("shopping-list").outerHTML], {type: "text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "shopping_list.html";
  a.click();
};
</script>
</body>
</html>
